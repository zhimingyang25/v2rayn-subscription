name: Refresh v2rayN subscription

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules can be delayed at the top of an hour.
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: subscription-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate v2rayN HTTP subscription from the Clash YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'base64'
          require 'cgi'
          require 'open-uri'
          require 'yaml'

          source_url = 'https://raw.githubusercontent.com/TopChina/proxy-list/refs/heads/main/clash_sub.yaml'
          document = URI.open(source_url, 'User-Agent' => 'v2rayn-subscription').read
          proxies = YAML.safe_load(document, aliases: true).fetch('proxies', [])

          links = proxies.filter_map do |proxy|
            next unless proxy['type'] == 'http' && proxy['server'] && proxy['port']

            escape = ->(value) { CGI.escape(value.to_s).tr('+', '%20') }
            user = proxy['username'].to_s
            password = proxy['password'].to_s
            auth = user.empty? ? '' : "#{escape.call(user)}:#{escape.call(password)}@"
            "http://#{auth}#{proxy['server']}:#{proxy['port']}##{escape.call(proxy['name'])}"
          end

          abort 'No HTTP proxy nodes found in the upstream subscription.' if links.empty?
          Dir.mkdir('subscriptions') unless Dir.exist?('subscriptions')
          File.write('subscriptions/v2rayn.txt', Base64.strict_encode64(links.join("\n")))
          RUBY
          test -s subscriptions/v2rayn.txt

      - name: Commit changed subscription
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptions/v2rayn.txt
          git diff --cached --quiet || git commit -m 'chore: refresh v2rayN subscription'
          git push
