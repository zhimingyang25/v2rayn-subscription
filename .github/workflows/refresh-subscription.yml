name: Refresh v2rayN subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: subscription-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror upstream subscription
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subscriptions
          curl --fail --silent --show-error --retry 3 \
            'https://234.qzz.io/fsllist64' \
            -o subscriptions/v2rayn.txt
          python3 - <<'PY'
          import base64
          from pathlib import Path
          content = Path("subscriptions/v2rayn.txt").read_text().strip()
          if not content:
              raise SystemExit("Empty upstream subscription")
          base64.b64decode(content, validate=True)
          PY

      - name: Commit changed subscription
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptions/v2rayn.txt
          git diff --cached --quiet || git commit -m 'chore: refresh v2rayN subscription'
          git push
